name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  context:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install context development dependencies
        run: python -m pip install -e "./context[dev]"
      - name: Context and unified plugin tests
        run: python -m pytest context/tests tests -q
      - name: Build independently installable context package
        run: python -m build context --outdir dist/context
      - name: Build unified plugin archive
        run: python scripts/build_plugin_archive.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install -r requirements-dev.txt

      - name: 语法检查（compileall）
        run: python -m compileall -q .

      - name: 单元测试
        run: pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 锁文件预检
        run: |
          node -e "const fs = require('fs'); const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8')); if (lock.lockfileVersion < 1) throw new Error('Unsupported lockfileVersion'); console.log('lockfileVersion=' + lock.lockfileVersion)"
          npm config get package-lock

      - name: 安装依赖
        run: npm ci

      - name: 构建检查
        run: npm run build

      - name: Lint
        run: npm run lint
